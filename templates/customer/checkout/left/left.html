<div class="row">
    <div class="col-md-12">
        <div class="checkout-bill">
            <h3 class="title-7 mb-4">Billing Details</h3>
        </div>

        <div class="row mb-3">
            <div class="col-md-6">
                <label for="username-email" class="form-label">
                    Username or Email <span class="required">*</span>
                </label>
                <input type="text" id="username-email" class="form-control" />
            </div>
            <div class="col-md-6">
                <label for="mobile" class="form-label">
                    Mobile <span class="required">*</span>
                </label>
                <input type="text" id="mobile" class="form-control" />
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-md-12">
                <label for="email-address" class="form-label">Email Address</label>
                <input type="email" id="email-address" class="form-control" />
            </div>
        </div>

        <div class="form-check mb-3">
            <input type="checkbox" class="form-check-input" id="ship-different-address" checked />
            <label class="form-check-label" for="ship-different-address">
                Ship to a different address
            </label>
        </div>

        <div id="shipping-address-fields">
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="city" class="form-label">
                        City <span class="required">*</span>
                    </label>
                    <input type="text" id="city" class="form-control" />
                </div>
                <div class="col-md-6">
                    <label for="address" class="form-label">
                        Address <span class="required">*</span>
                    </label>
                    <input type="text" id="address" class="form-control" />
                </div>
            </div>
        </div>
    </div>
</div>
